<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Mods</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#111827;
color:white;
padding:40px;
}

a{
text-decoration:none;
}

.back{
display:inline-block;
margin-bottom:30px;
padding:12px 20px;
background:#22C55E;
border-radius:12px;
color:white;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:#1F2937;
border-radius:18px;
overflow:hidden;
border:1px solid #2c3645;
transition:.2s;
}

.card:hover{
transform:translateY(-8px);
border-color:#22C55E;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.content{
padding:18px;
}

.content h2{
margin-bottom:10px;
}

.content p{
color:#aaa;
margin-bottom:15px;
}

.btn{
display:inline-block;
padding:10px 18px;
background:#22C55E;
border-radius:10px;
color:white;
}

</style>
</head>

<body>

<a href="index.html" class="back">← Kembali</a>

<h1 style="margin-bottom:30px;">My Mods</h1>

<div class="grid">

<div class="card">
<img src="mod1.png">
<div class="content">
<h2>FPS Boost</h2>
<p>Meningkatkan FPS Minecraft.</p>
<a href="#" class="btn">Download</a>
</div>
</div>

<div class="card">
<img src="mod2.png">
<div class="content">
<h2>Better UI</h2>
<p>Mempercantik tampilan Minecraft.</p>
<a href="#" class="btn">Download</a>
</div>
</div>

<div class="card">
<img src="mod3.png">
<div class="content">
<h2>Coming Soon</h2>
<p>Masih dikembangkan.</p>
<a href="#" class="btn">Soon</a>
</div>
</div>

</div>

</body>
</html>
