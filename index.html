<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Grid Cards</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    background:#111827;
    color:white;
}

header{
    padding:40px 20px;
    text-align:center;
}

header h1{
    font-size:40px;
}

header p{
    color:#9CA3AF;
    margin-top:10px;
}

.container{
    max-width:1300px;
    margin:auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:#1F2937;
    border-radius:18px;
    overflow:hidden;
    transition:.25s;
    border:1px solid #2c3645;
}

.card:hover{
    transform:translateY(-8px);
    border-color:#22C55E;
    box-shadow:0 15px 35px rgba(34,197,94,.18);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.content{
    padding:18px;
}

.content h2{
    font-size:22px;
    margin-bottom:10px;
}

.content p{
    color:#b9c0c9;
    line-height:1.6;
    margin-bottom:18px;
}

.btn{
    display:inline-block;
    padding:10px 18px;
    background:#22C55E;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:600;
    transition:.2s;
}

.btn:hover{
    background:#16A34A;
}
</style>

</head>
<body>

<header>
<h1>5Lexy</h1>
<p>Link Support Dan Discord Di Bawah.</p>
</header>

<div class="container">

<div class="grid">

<div class="card">
<img src="https://picsum.photos/600/400?1">
<div class="content">
<h2>My Saweria</h2>
<p>Supportnya Kha Kha.</p>
<a href="https://saweria.co/5Lexy" class="btn" target="_blank">Buka</a>
</div>
</div>

<div class="card">
<img src="images/Proyek Baru 37 [14C360E].png">
<div class="content">
<h2>My Discord.</h2>
<p>Gabung Dan Dapatkan Teman Lebih Banyak .</p>
<a href="https://discord.gg/uuXENQwMf" class="btn" target="_blank">Gabung</a>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/600/400?3">
<div class="content">
<h2>List My Mods</h2>
<p>My Mods Menkrep.</p>
<a href="mods.html" class="btn">Lihat</a>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/600/400?4">
<div class="content">
<h2>Coming Soon</h2>
<p>Coming Soon.</p>
<a href="#" class="btn"disable>Coming Soon</a>
</div>
</div>

</div>

</div>

</body>
</html>
